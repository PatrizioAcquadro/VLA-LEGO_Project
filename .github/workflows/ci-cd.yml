name: CI

on:
  push:
    branches: ["**"]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.10"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff==0.15.3" "black==26.1.0"
      - run: ruff check . --output-format=github
      - run: black --check src scripts tests
      - run: python scripts/check_docs.py

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ci]"
      - run: mypy src/vla_lego

  test:
    name: Software Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ci,reporting]"
      - run: python -m pytest tests -q

  package:
    name: Installed Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ci]"
      - run: python scripts/check_install.py

  ci-success:
    name: CI Success
    needs: [lint, typecheck, test, package]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check required jobs
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          for result in "$LINT" "$TYPECHECK" "$TEST" "$PACKAGE"; do
            test "$result" = success || exit 1
          done
