[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-lego"
version = "0.1.0"
description = "Vision-Language-Action Components for Lightweight Brick Assembly"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Patrizio Acquadro", email = "pacquadr@purdue.edu"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.10,<2.11",
    "numpy>=1.24",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
ci = ["pytest>=7", "ruff==0.15.3", "black==26.1.0", "mypy>=1", "build>=1", "setuptools>=61", "wheel"]
sim = ["mujoco>=3.1,<4", "imageio[ffmpeg]>=2.31"]
vlm = [
    "transformers>=5.20,<6",
    "Pillow>=10",
    "accelerate>=1,<2",
    "sentencepiece>=0.2",
    "torchvision>=0.25,<0.26",
]
tracking = ["wandb>=0.15"]
dev = ["vla-lego[ci,sim,vlm,tracking]", "pre-commit>=3"]

[project.scripts]
vla-viewer = "vla_lego.sim.viewer:main"
vla-lint-assets = "vla_lego.sim.asset_linter_cli:main"
vla-gen-bricks = "vla_lego.sim.bricks.cli:main"
vla-demo = "vla_lego.sim.demo:main"
vla-validate-model = "vla_lego.models.validate:main"

[project.urls]
Repository = "https://github.com/PatrizioAcquadro/VLA-LEGO_Project"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vla_lego*"]
namespaces = false

[tool.setuptools.package-data]
"vla_lego.sim" = ["assets/**/*.xml", "assets/**/*.obj", "assets/**/*.stl", "assets/**/PROVENANCE.md"]
"vla_lego.configs" = ["**/*.yaml"]

# ============================================================================
# Tool Configurations
# ============================================================================

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
    | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build", "dist", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning",
]
