# Shared Qwen backbone. SDPA uses PyTorch without an extra attention dependency.
name: vlm
architecture:
  type: vlm
vlm:
  model_id: Qwen/Qwen3.5-4B
  revision: null
  torch_dtype: bfloat16
  device_map: auto
  trust_remote_code: false
  attn_implementation: sdpa
  max_seq_length: 8192
  cache_dir: ${oc.env:HF_HUB_CACHE,${oc.env:HF_HOME,${oc.env:HOME}/.cache/huggingface}/hub}
  processor:
    image_resolution: 320
    padding: longest
    truncation: true
  freeze:
    backbone: true
    vision_encoder: true
